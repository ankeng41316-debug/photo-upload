<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e9e9e9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 720px;
            width: 100%;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .notice {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: clamp(1.4rem, 5vw, 2rem);
            line-height: 1.6;
        }

        .red {
            color: #e60000;
        }

        .blue {
            color: #0033cc;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .notice {
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="IMG_0031.jpeg" alt="菜單照片">
        <div class="notice red">
            颱風天定位酌收250$ 定金，轉帳完才算訂位。
        </div>
        <div class="notice blue">
            外帶請先私訊需要的飲品/餐點，稍等5-10分鐘後再到店取餐。
        </div>
    </div>
</body>
</html>
